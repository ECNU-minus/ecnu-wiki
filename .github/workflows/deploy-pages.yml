# ==============================================================================
# ECNU-Wiki · 构建并发布 GitHub Pages
# 在 push 到 main（含 Pull Request 合并）时触发：
#   1) 配置 Pages
#   2) 安装 Python 依赖并构建 MkDocs 站点
#   3) 上传构建产物并部署到 GitHub Pages
# 参考 mkdocs-material 官方 publishing 指南中的做法。
# ==============================================================================

name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches: [main]
  # 允许在 Actions 页面手动触发构建，便于调试
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个并发部署；正在进行的旧部署将被取消（快速失败）。
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build with MkDocs
        run: mkdocs build --strict

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
